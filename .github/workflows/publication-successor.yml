name: Current public-practice successor
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  current:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install playwright==1.55.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 scripts/verify-publication.py
      - run: python3 scripts/test-publication-source.py
      - run: python3 scripts/test-current-doc-links.py
      - run: python3 scripts/test-education-examples.py
      - run: python3 scripts/test-publication-onboarding.py . --output /tmp/onboarding-clone
      - name: Exact current archive without Git metadata
        run: |
          mkdir /tmp/onboarding-source
          git archive HEAD | tar -x -C /tmp/onboarding-source
          python3 scripts/test-publication-onboarding.py /tmp/onboarding-source --output /tmp/onboarding-zip
      - run: git diff --exit-code
