name: Public installer contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test flash/first-install/*.test.mjs
      - run: python3 scripts/package-public.py
      - run: git diff --exit-code -- release/inventory.json
