[package]
name = "entropylab-fixture"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "LICENSE"
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc", "lowmemory"] }
bitcoin_hashes = { version = "=0.14.101", default-features = false, features = ["alloc"] }
bitcoin = { version = "=0.32.11", default-features = false, features = ["secp-lowmemory"] }
bip39 = { version = "=2.2.2", default-features = false }
[profile.release]
panic = "abort"
opt-level = "s"
